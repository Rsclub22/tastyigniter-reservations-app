org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Die Standard-Hierarchie von Kotlin vertraegt sich nicht mit eigenen
# dependsOn-Kanten, und :shared braucht eine: jvmCommonMain zwischen commonMain
# und den beiden JVM-Zielen. Bei nur Android + Desktop bringt die Vorlage ohnehin
# nichts, was hier gebraucht wuerde.
kotlin.mpp.applyDefaultHierarchyTemplate=false
