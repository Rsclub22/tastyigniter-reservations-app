[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# Compose Multiplatform. 1.12.1 behebt laut Release-Notes die Kompatibilität mit
# Kotlin 2.5 und deckt damit das hier verwendete 2.4.20 ab.
composeMultiplatform = "1.12.1"
# Die erweiterten Material-Icons werden seit 1.7.3 nicht mehr weitergepflegt. Die
# Release-Notes von CMP 1.8.0 sagen für das Schwesterpaket material-icons-core
# ausdrücklich, man solle es auf 1.7.3 pinnen - für extended gilt dasselbe. Das
# Artefakt bringt Varianten für androidJvm und jvm mit, also für beide Ziele hier.
composeIcons = "1.7.3"
coreKtx = "1.17.0"
workmanager = "2.12.0"
activityCompose = "1.11.0"
# Multiplatform-Ports von JetBrains (org.jetbrains.androidx.*), nicht die
# Android-Fassungen aus androidx.*.
lifecycle = "2.11.0"
navigation = "2.9.2"
# datastore-preferences-core ist die multiplatform-fähige Variante; das frühere
# datastore-preferences hing an einem android.content.Context.
datastore = "1.2.1"
okio = "3.18.2"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
junit = "4.13.2"

[libraries]
# --- geteilt (jvmCommonMain) ---
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
compose-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# --- nur Android ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# --- nur Desktop ---
# Dispatchers.Main auf dem Desktop; viewModelScope läuft darauf.
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

# --- Tests ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9: das Multiplatform-Plugin und com.android.application duerfen nicht im
# selben Modul stehen. Die Android-Seite von :shared laeuft daher ueber diese
# Bibliotheksvariante.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
