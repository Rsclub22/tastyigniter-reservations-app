name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Lint, Tests & Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint & Unit-Tests
        run: ./gradlew lintDebug testDebugUnitTest :shared:test :desktop:test --stacktrace

      - name: Debug-APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            shared/build/reports/tests/
            desktop/build/reports/tests/
          retention-days: 14

  desktop:
    name: Linux-Desktop-Paket (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # jpackage needs fakeroot to build .deb packages.
      - name: Paketwerkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot

      - name: .deb bauen
        run: ./gradlew :desktop:packageDeb

      - name: .deb hochladen
        uses: actions/upload-artifact@v7
        with:
          name: desktop-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          retention-days: 14

  release:
    name: Signiertes Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Paketwerkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot

      - name: Keystore aus Secrets bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – das Release wird nur mit einem Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK, -AAB und Desktop-.deb bauen
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease :desktop:packageDeb
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ti-reservierungen-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ti-reservierungen-${VERSION_NAME}.aab"
          cp desktop/build/compose/binaries/main/deb/*.deb dist/

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
