name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Lint, Tests & Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint & Unit-Tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          retention-days: 14

  release:
    name: Signiertes Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secrets bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – das Release wird nur mit einem Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK und -AAB bauen
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ti-reservierungen-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ti-reservierungen-${VERSION_NAME}.aab"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
