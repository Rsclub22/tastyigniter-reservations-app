name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Lint, Tests & Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Die Unit-Tests liegen in :shared/jvmCommonTest und laufen über das
      # Desktop-Ziel. Dieselben Klassen, dieselbe JVM - das Android-Ziel der
      # KMP-Bibliothek bringt von sich aus keinen Test-Quellsatz mit.
      - name: Lint & Unit-Tests
        run: ./gradlew :app:lintDebug :shared:desktopTest --stacktrace

      - name: Debug-APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            shared/build/reports/tests/
          retention-days: 14

  desktop:
    name: Desktop-Paket (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # jpackage baut ausschliesslich für das System, auf dem es läuft. Windows
      # und macOS brauchen daher eigene Runner - hier vorgemerkt, noch nicht aktiv:
      #   - { os: windows-latest, task: packageMsi, artefakt: msi }
      #   - { os: macos-latest,   task: packageDmg, artefakt: dmg }
      matrix:
        include:
          - { os: ubuntu-latest, task: packageDeb, artefakt: deb }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Paket bauen
        run: ./gradlew :shared:${{ matrix.task }}

      - name: Paket hochladen
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artefakt }}
          path: shared/build/compose/binaries/main/${{ matrix.artefakt }}/*
          retention-days: 14

      - name: jpackage-Protokolle bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-${{ matrix.artefakt }}
          path: shared/build/compose/logs/
          retention-days: 7

  release:
    name: Signiertes Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Volle Historie samt Tags: die Änderungsliste braucht den vorigen Tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore aus Secrets bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – das Release wird nur mit einem Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK, -AAB und Desktop-Paket bauen
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew :app:assembleRelease :app:bundleRelease :shared:packageDeb :shared:createDistributable
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ti-reservierungen-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ti-reservierungen-${VERSION_NAME}.aab"
          cp shared/build/compose/binaries/main/deb/*.deb "dist/"

          # Das ausgepackte Programm als .tar.gz. Nur damit kann sich die
          # Desktop-Fassung selbst erneuern: eine über die Paketverwaltung
          # installierte Fassung gehört ihr, und ohne Root kommt die App dort
          # nicht heran. Die Update-Prüfung sucht nach genau dieser Endung
          # (s. Main.kt, assetSuffix).
          tar czf "dist/ti-reservierungen-${VERSION_NAME}-linux-x64.tar.gz" \
            -C shared/build/compose/binaries/main/app tastyigniter-reservierungen

          # Prüfsumme daneben: die App spielt ohne sie nichts ein, weil ein
          # abgebrochener Download sonst aussähe wie eine neue Fassung.
          ( cd dist && sha256sum "ti-reservierungen-${VERSION_NAME}-linux-x64.tar.gz" \
              > "ti-reservierungen-${VERSION_NAME}-linux-x64.tar.gz.sha256" )

      # Die Änderungsliste für Play ("Neuerungen") und das GitHub-Release.
      # Vorrang hat die Nachricht eines annotierten Tags (git tag -a), weil die
      # Commit-Betreffe ohne Umlaute geschrieben sind und auch Dinge nennen, die
      # die Tester nichts angehen. Nur bei einem leichtgewichtigen Tag werden
      # die Betreffe seit dem vorigen Tag genommen.
      - name: Aenderungsliste erstellen
        run: |
          export LC_ALL=C.UTF-8
          # actions/checkout legt den Tag beim Tag-Lauf leichtgewichtig an
          # (actions/checkout#290); ohne erneutes Holen fehlt die Nachricht.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            # Nicht %(contents:subject): das faltet den ersten Absatz, also
            # eine Liste ohne Leerzeile darunter, zu einer einzigen Zeile.
            git cat-file tag "$GITHUB_REF_NAME" \
              | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----/,$d' \
              | sed '/^\s*$/d; /^- /!s/^/- /' > "$RUNNER_TEMP/aenderungen.txt"
          else
            VORHER=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${VORHER:+"${VORHER}.."}"$GITHUB_REF_NAME" \
              > "$RUNNER_TEMP/aenderungen.txt"
          fi

          # Play nimmt höchstens 500 Zeichen je Sprache und lehnt sonst den
          # ganzen Upload ab. Deshalb ganze Zeilen behalten, solange sie passen.
          mkdir -p "$RUNNER_TEMP/whatsnew"
          NL=$'\n'
          NOTIZ=""
          while IFS= read -r ZEILE; do
            KANDIDAT="${NOTIZ:+${NOTIZ}${NL}}${ZEILE}"
            if [ "${#KANDIDAT}" -gt 498 ]; then
              NOTIZ="${NOTIZ:-${ZEILE:0:497}}${NL}…"
              break
            fi
            NOTIZ="$KANDIDAT"
          done < "$RUNNER_TEMP/aenderungen.txt"
          printf '%s\n' "$NOTIZ" > "$RUNNER_TEMP/whatsnew/whatsnew-de"

          echo "## Änderungen" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/aenderungen.txt" >> "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-de"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true

      # Google Play, interner Test. Bewusst NACH dem GitHub-Release: schlägt der
      # Upload fehl - abgelaufenes Dienstkonto, Störung bei Google, abgelehnter
      # versionCode -, ist das Release trotzdem schon draußen und die
      # Desktop-Fassung kann sich erneuern.
      - name: Dienstkonto für Google Play bereitstellen
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt – der Upload zu Google Play entfällt."
            exit 0
          fi
          # Ohne echten Keystore ist das AAB mit dem Debug-Schlüssel signiert.
          # Play lehnt so eins ab; dann soll der Lauf es gar nicht erst
          # versuchen, statt an Google zu scheitern.
          if [ -z "$ANDROID_KEYSTORE_FILE" ]; then
            echo "::warning::Ohne ANDROID_KEYSTORE_BASE64 ist das AAB debug-signiert – kein Upload zu Google Play."
            exit 0
          fi
          echo "PLAY_UPLOAD=ja" >> "$GITHUB_ENV"

      - name: AAB in den internen und den geschlossenen Test hochladen
        if: env.PLAY_UPLOAD == 'ja'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.rsclub22.tireservations
          releaseFiles: dist/*.aab
          releaseName: ${{ github.ref_name }}
          # 'track' (Einzahl) ist abgekuendigt und faellt in einer kommenden
          # Fassung der Action weg; 'tracks' ist der Nachfolger.
          # alpha ist der geschlossene Test. Beide in einer Bearbeitung, damit
          # nicht der eine Track neu ist und der andere noch die alte Fassung hat.
          tracks: internal,alpha
          # Sofort für die Tester sichtbar (der geschlossene Test erst nach der
          # Prüfung durch Google). Der Schritt in die Produktion bleibt ein
          # bewusster Klick in der Play Console.
          status: completed
          # Dateien whatsnew-<Sprache>; ergibt dasselbe wie <de>…</de>
          # beim Einfügen in der Play Console.
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          # Ohne die Zuordnungsdatei sind Abstürze in der Play Console
          # unlesbar - der Release-Build läuft mit isMinifyEnabled.
          mappingFile: app/build/outputs/mapping/release/mapping.txt
